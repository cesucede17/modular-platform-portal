[project]
name = "sge-dashboard"
version = "0.1.0"
description = "El recibidor de la Plataforma SGE"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "authlib>=1.3.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "itsdangerous>=2.1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
